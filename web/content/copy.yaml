# The FAQ: 5 questions at most. Each answer is 2 sentences at most.

faq_1_q:
  where: Home page, FAQ, question 1
  max: 80
  text: >-
    Will it add skills I do not have?

faq_1_a:
  where: Home page, FAQ, answer 1
  max: 220
  text: >-
    It is built not to. If the job asks for something your resume does not
    show, it is listed as missing and left out.

faq_2_q:
  where: Home page, FAQ, question 2
  max: 80
  text: >-
    Will this get me past an ATS?

faq_2_a:
  where: Home page, FAQ, answer 2
  max: 220
  text: >-
    We do not promise that. The PDF is one column of real text with standard
    headings, which resume software can read.

faq_3_q:
  where: Home page, FAQ, question 3
  max: 80
  text: >-
    Why did it change so few lines?

faq_3_a:
  where: Home page, FAQ, answer 3
  max: 220
  text: >-
    It rewrites a line only when the new one fits the job better and passes
    the check. Every other line stays as you wrote it.

faq_4_q:
  where: Home page, FAQ, question 4
  max: 80
  text: >-
    What can I upload?

faq_4_a:
  where: Home page, FAQ, answer 4
  max: 220
  text: >-
    A PDF with text you can select, up to 2 MB, or pasted text. Scanned PDFs
    do not work.

faq_5_q:
  where: Home page, FAQ, question 5
  max: 80
  text: >-
    Is it free?

faq_5_a:
  where: Home page, FAQ, answer 5
  max: 220
  text: >-
    Yes. It is a demo with a few live runs a day, and you can watch a
    recorded run at any time.

