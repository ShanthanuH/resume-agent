# Every word a visitor can read on SwooshCV is in this file.
#
# How to edit:
#   - Change only the lines under "text:". Keep them indented by 4 spaces.
#   - "where" says where the text shows. "max" is the most characters allowed.
#   - If a text has a word in curly brackets, like {count}, keep that word
#     exactly. The site puts a number or a time there. "keep" lists them.
#   - No quotes needed. Do not rename a key (the name before the colon).
#
# After editing, run "npm run copy" in the web folder. It tells you in plain
# words if a text is too long or a key is missing, for example:
#   copy.yaml: home_title_1 is 61 characters, max is 50
# The dev server, the build and the tests run the same check.
#
# The home page may hold 150 visible words at most (keys that start with nav_,
# footer_ and home_). The calm skin's home page may hold 220 (keys that start
# with calm_hero_ and calm_home_). Keys that start with home_more_ sit behind a
# toggle and are not counted. The FAQ is not counted.

