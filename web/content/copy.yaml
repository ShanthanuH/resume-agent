# ==========================================================================
# PRIVACY PAGE (/privacy)
# Each line must stay true to what the code does. If the code changes, change
# this page with it.
# ==========================================================================

privacy_meta_title:
  where: Browser tab on the privacy page
  max: 40
  text: >-
    Privacy

privacy_meta_description:
  where: Link preview of the privacy page
  max: 160
  text: >-
    What is sent, to whom, and what is kept. In plain words.

privacy_title:
  where: Privacy page, heading
  max: 40
  text: >-
    Privacy

privacy_lead:
  where: Privacy page, line under the heading
  max: 160
  text: >-
    SwooshCV is built so you can check what it does. That includes what it
    does with your data.

privacy_keep_title:
  where: Privacy page, section 1 heading
  max: 50
  text: >-
    What we keep

privacy_keep_1:
  where: Privacy page, section 1, point 1
  max: 260
  text: >-
    Nothing. Your resume and the job post are worked on in memory and are
    gone when the run ends. There is no database of resumes and no account.

privacy_keep_2:
  where: Privacy page, section 1, point 2
  max: 260
  text: >-
    If you upload a PDF, it is written to a temporary file so the text can be
    read. That file is deleted straight away.

privacy_keep_3:
  where: Privacy page, section 1, point 3
  max: 260
  text: >-
    Your result lives in your browser tab. Close or reload the tab and it is
    gone.

privacy_model_title:
  where: Privacy page, section 2 heading
  max: 50
  text: >-
    What is sent to the AI model

privacy_model_1:
  where: Privacy page, section 2, point 1
  max: 260
  text: >-
    The text of your resume and the job post is sent to Google's Gemini API,
    which does the reading and the rewriting.

privacy_model_2:
  where: Privacy page, section 2, point 2
  max: 260
  text: >-
    Before that, your email address, phone number and web links are swapped
    for placeholders, so the model never sees them. They are put back only in
    the result shown to you.

privacy_model_3:
  where: Privacy page, section 2, point 3
  max: 260
  text: >-
    Your name and anything else written in the resume, such as a city,
    employers and schools, is sent as part of the text.

privacy_model_4:
  where: Privacy page, section 2, point 4
  max: 260
  text: >-
    We use the paid Gemini API. Google's terms for the paid API say it does
    not use that content to improve its products. Google may keep it for a
    limited time to detect abuse.

privacy_logs_title:
  where: Privacy page, section 3 heading
  max: 50
  text: >-
    What our logs hold

privacy_logs_1:
  where: Privacy page, section 3, point 1
  max: 260
  text: >-
    For each run: how long it took, how many steps it took, how much text the
    AI model read and wrote (as a count), what it cost us, and how many lines
    it changed. No resume text and no job text.

privacy_logs_2:
  where: Privacy page, section 3, point 2
  max: 300
  text: >-
    To hold the daily limit we count runs per IP address. The count is kept
    for up to two days in a small database (Upstash Redis), under a scrambled
    form of the address that cannot be turned back into it.

privacy_others_title:
  where: Privacy page, section 4 heading
  max: 50
  text: >-
    Other companies involved

privacy_others_1:
  where: Privacy page, section 4, point 1
  max: 260
  text: >-
    Hosting: the website and the tailoring both run on Vercel. Like any host,
    it sees your IP address and the requests you make.

privacy_others_2:
  where: Privacy page, section 4, point 2
  max: 260
  text: >-
    Bot check: before a run, Cloudflare Turnstile checks that you are a
    person. Cloudflare sees your IP address and some browser details to do
    that.

privacy_others_3:
  where: Privacy page, section 4, point 3
  max: 260
  text: >-
    We set no cookies for visitors and run no advertising trackers on this
    site.

privacy_code:
  where: Privacy page, last line, before the link
  max: 80
  text: >-
    The code that does all of this is public.

privacy_code_link:
  where: Privacy page, last line, the link to GitHub
  max: 40
  text: >-
    Read it on GitHub

